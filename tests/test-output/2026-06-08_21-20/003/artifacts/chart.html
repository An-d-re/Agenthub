<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>某公司Q1销售额及环比分析</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .container {
            max-width: 1000px;
            width: 100%;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            padding: 40px 30px;
        }

        .header {
            text-align: center;
            margin-bottom: 10px;
        }

        .header h1 {
            font-size: 28px;
            color: #1a1a2e;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .header .subtitle {
            font-size: 14px;
            color: #888;
            margin-top: 6px;
        }

        .divider {
            height: 3px;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 3px;
            margin: 20px 0 30px 0;
        }

        .chart-wrapper {
            position: relative;
            height: 450px;
            width: 100%;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-top: 30px;
        }

        .stat-card {
            background: #f8f9fe;
            border-radius: 12px;
            padding: 18px 14px;
            text-align: center;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .stat-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.15);
        }

        .stat-card .label {
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .stat-card .value {
            font-size: 22px;
            font-weight: 700;
            color: #1a1a2e;
        }

        .stat-card .value.primary {
            color: #667eea;
        }

        .stat-card .value.success {
            color: #2ecc71;
        }

        .stat-card .value.warning {
            color: #f39c12;
        }

        .stat-card .value.danger {
            color: #e74c3c;
        }

        .data-table {
            margin-top: 30px;
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        .data-table th {
            background: #667eea;
            color: #fff;
            padding: 12px 16px;
            text-align: center;
            font-weight: 600;
        }

        .data-table th:first-child {
            border-radius: 10px 0 0 0;
        }

        .data-table th:last-child {
            border-radius: 0 10px 0 0;
        }

        .data-table td {
            padding: 12px 16px;
            text-align: center;
            border-bottom: 1px solid #eee;
        }

        .data-table tr:hover td {
            background: #f0f2ff;
        }

        .data-table .badge {
            display: inline-block;
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge-up {
            background: #e8f8f0;
            color: #2ecc71;
        }

        .badge-down {
            background: #fde8e8;
            color: #e74c3c;
        }

        .badge-neutral {
            background: #f0f0f0;
            color: #888;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            font-size: 12px;
            color: #aaa;
        }

        @media (max-width: 700px) {
            .container {
                padding: 20px 15px;
            }
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .chart-wrapper {
                height: 350px;
            }
            .header h1 {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 某公司 Q1 销售额及环比分析</h1>
            <p class="subtitle">2025年第一季度 · 单位：万元 (万)</p>
        </div>
        <div class="divider"></div>

        <div class="chart-wrapper">
            <canvas id="salesChart"></canvas>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="label">Q1 总销售额</div>
                <div class="value primary">508 万</div>
            </div>
            <div class="stat-card">
                <div class="label">月均销售额</div>
                <div class="value success">169.33 万</div>
            </div>
            <div class="stat-card">
                <div class="label">最高月</div>
                <div class="value warning">3月 · 203 万</div>
            </div>
            <div class="stat-card">
                <div class="label">整体增长率</div>
                <div class="value danger">+69.17%</div>
            </div>
        </div>

        <table class="data-table">
            <thead>
                <tr>
                    <th>月份</th>
                    <th>销售额 (万)</th>
                    <th>环比增长额 (万)</th>
                    <th>环比增长率</th>
                    <th>趋势</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td><strong>1月</strong></td>
                    <td>120</td>
                    <td>—</td>
                    <td>—</td>
                    <td><span class="badge badge-neutral">基准月</span></td>
                </tr>
                <tr>
                    <td><strong>2月</strong></td>
                    <td>185</td>
                    <td>+65</td>
                    <td>+54.17%</td>
                    <td><span class="badge badge-up">↑ 大幅增长</span></td>
                </tr>
                <tr>
                    <td><strong>3月</strong></td>
                    <td>203</td>
                    <td>+18</td>
                    <td>+9.73%</td>
                    <td><span class="badge badge-up">↑ 稳步增长</span></td>
                </tr>
            </tbody>
        </table>

        <div class="footer">
            数据来源：某公司财务报告 · 图表使用 Chart.js 生成
        </div>
    </div>

    <script>
        // 注册 datalabels 插件
        Chart.register(ChartDataLabels);

        const ctx = document.getElementById('salesChart').getContext('2d');

        const months = ['1月', '2月', '3月'];
        const salesData = [120, 185, 203];
        const growthRates = [null, 54.17, 9.73]; // 百分比数值

        // 柱状图颜色渐变
        const barColors = [
            'rgba(102, 126, 234, 0.85)',
            'rgba(102, 126, 234, 0.95)',
            'rgba(102, 126, 234, 1)'
        ];
        const barBorderColors = [
            'rgba(102, 126, 234, 1)',
            'rgba(102, 126, 234, 1)',
            'rgba(102, 126, 234, 1)'
        ];

        const chart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: months,
                datasets: [
                    {
                        label: '销售额 (万)',
                        data: salesData,
                        backgroundColor: barColors,
                        borderColor: barBorderColors,
                        borderWidth: 2,
                        borderRadius: 6,
                        barPercentage: 0.55,
                        yAxisID: 'y',
                        order: 2
                    },
                    {
                        label: '环比增长率 (%)',
                        data: growthRates,
                        type: 'line',
                        borderColor: '#e74c3c',
                        backgroundColor: 'rgba(231, 76, 60, 0.1)',
                        borderWidth: 3,
                        pointBackgroundColor: ['#e74c3c', '#e74c3c', '#e74c3c'],
                        pointBorderColor: '#fff',
                        pointBorderWidth: 2,
                        pointRadius: 6,
                        pointHoverRadius: 9,
                        fill: true,
                        tension: 0.3,
                        yAxisID: 'y1',
                        order: 1,
                        spanGaps: true
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                interaction: {
                    mode: 'index',
                    intersect: false
                },
                plugins: {
                    legend: {
                        position: 'top',
                        labels: {
                            font: {
                                size: 14,
                                weight: '600'
                            },
                            padding: 20,
                            usePointStyle: true,
                            pointStyle: 'circle'
                        }
                    },
                    tooltip: {
                        backgroundColor: 'rgba(26, 26, 46, 0.9)',
                        titleFont: { size: 14, weight: '600' },
                        bodyFont: { size: 13 },
                        padding: 12,
                        cornerRadius: 8,
                        callbacks: {
                            label: function(context) {
                                let label = context.dataset.label || '';
                                let val = context.raw;
                                if (label.includes('增长率')) {
                                    return label + ': ' + (val === null ? '—' : val.toFixed(2) + '%');
                                }
                                return label + ': ' + val + ' 万';
                            }
                        }
                    },
                    datalabels: {
                        display: function(context) {
                            // 只在柱状图上显示数据标签（折线图不显示）
                            return context.datasetIndex === 0;
                        },
                        color: '#1a1a2e',
                        anchor: 'end',
                        align: 'end',
                        offset: 2,
                        font: {
                            weight: 'bold',
                            size: 14
                        },
                        formatter: function(value) {
                            return value + '万';
                        }
                    }
                },
                scales: {
                    x: {
                        grid: {
                            display: false
                        },
                        ticks: {
                            font: {
                                size: 13,
                                weight: '600'
                            }
                        }
                    },
                    y: {
                        position: 'left',
                        title: {
                            display: true,
                            text: '销售额 (万)',
                            font: {
                                size: 13,
                                weight: '600'
                            }
                        },
                        min: 0,
                        max: 260,
                        grid: {
                            color: 'rgba(0, 0, 0, 0.06)'
                        },
                        ticks: {
                            stepSize: 40,
                            callback: function(value) {
                                return value + '万';
                            }
                        }
                    },
                    y1: {
                        position: 'right',
                        title: {
                            display: true,
                            text: '环比增长率 (%)',
                            font: {
                                size: 13,
                                weight: '600'
                            }
                        },
                        min: 0,
                        max: 70,
                        grid: {
                            display: false
                        },
                        ticks: {
                            stepSize: 10,
                            callback: function(value) {
                                return value + '%';
                            }
                        }
                    }
                }
            },
            plugins: [ChartDataLabels]
        });
    </script>
</body>
</html>
